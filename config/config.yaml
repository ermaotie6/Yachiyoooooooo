# Yachiyo 虚拟直播平台配置文件

# ============ 服务器配置 ============
server:
  host: "0.0.0.0"
  port: 8080
  debug: true
  log_level: "info"

# ============ WebSocket 配置 ============
websocket:
  enabled: true
  host: "0.0.0.0"
  port: 9001
  path: "/ws"
  max_connections: 1000
  heartbeat_interval_ms: 30000      # 30 秒心跳
  idle_timeout_ms: 300000           # 5 分钟空闲超时

# ============ 数据库配置 ============
database:
  type: "postgresql"
  host: "${DB_HOST:localhost}"
  port: 5432
  name: "${DB_NAME:yachiyo}"
  username: "${DB_USER:postgres}"
  password: "${DB_PASSWORD}"  # 从环境变量读取
  connection_timeout: 30
  poolSize: 10
  max_idle_time: 300

# ============ Redis 缓存配置 ============
redis:
  enabled: true
  host: "${REDIS_HOST:localhost}"
  port: 6379
  database: 0
  password: ""
  ttl_seconds: 3600
  pool_size: 10

# ============ GPT-SoVITS 配置 ============
gpt_sovits:
  enabled: true
  api_endpoint: "http://localhost:5000"  # 或云端端点
  api_key: "${SOVITS_API_KEY}"           # 从环境变量读取
  mode: "cpu"                              # "gpu" 或 "cpu"（影响超时策略）
  timeout_seconds: 60                      # CPU 模式建议 60，GPU 模式可设为 15
  
  # 语音参数预设
  voice_presets:
    default:
      pitch: 1.0
      speed: 1.0
      energy: 0.5
      reference_audio: ""
    playful:
      pitch: 1.2
      speed: 1.1
      energy: 0.8
      reference_audio: ""
    serious:
      pitch: 0.9
      speed: 0.9
      energy: 0.6
      reference_audio: ""

# ============ Live2D 配置 ============
live2d:
  model_path: "./resources/live2d"
  default_model: "yachiyo"
  
  # 表情映射 (emotion → expression文件名)
  # 注意: 必须与 yachiyo.model3.json 中的 Expressions.Name 一致
  # 当前可用表情: f_smile, f_sad, f_squint, f_cry
  expression_map:
    neutral: "f_smile"      # 模型无 f_default，用 f_smile 代替
    happy: "f_smile"
    sad: "f_sad"
    angry: "f_squint"       # 模型无 f_angry，用 f_squint 代替
    surprised: "f_cry"      # 模型无 f_surprised，用 f_cry 代替
    cry: "f_cry"
    squint: "f_squint"
  
  # 动作映射
  motion_map:
    greet: "m_greet"
    nod: "m_nod"
    shake: "m_shake"
    think: "m_think"
    wave: "m_wave"
    idle: "m_idle"

# ============ 内容审核配置 ============
moderation:
  enabled: true
  use_deepseek: true
  deepseek_api_key: "${DEEPSEEK_API_KEY}"  # 从环境变量读取
  deepseek_api_endpoint: "https://api.deepseek.com"
  
  # 审核策略
  quick_check_enabled: true         # 敏感词快速检查
  ai_moderation_enabled: true       # AI 审核
  contextual_check_enabled: true    # 上下文检查
  
  # 违规阈值 (0-1)
  thresholds:
    violence: 0.8
    adult: 0.9
    harassment: 0.7
    spam: 0.6
    hate: 0.7
    profanity: 0.8
  
  # 敏感词库路径
  keywords_path: "./resources/keywords/sensitive_words.txt"

# ============ OpenClaw 桥接服务配置 ============
# 架构: C++ 后端 ↔ Node.js 桥接服务 ↔ OpenClaw
# C++ 后端通过桥接服务间接与 OpenClaw 通信
openclaw:
  enabled: true
  
  # 桥接服务地址 (Node.js bridge 的接收端口)
  # 架构: C++ 后端 → 桥接服务(:8765) → OpenClaw(:8000) → 同步返回
  bridge_endpoint: "http://localhost:8765"
  
  # 请求超时 (秒)
  request_timeout: 30
  
  # 性能优化
  response_cache_enabled: true
  response_cache_ttl: 300            # 响应缓存 5 分钟

# ============ 翻译配置 ============
translation:
  enabled: true
  default_language: "zh"
  
  # 翻译服务（按优先级排序）
  services:
    - name: "baidu"
      appid: "${BAIDU_TRANSLATE_APPID}"
      api_key: "${BAIDU_TRANSLATE_API_KEY}"
      endpoint: "https://fanyi-api.baidu.com/api/trans/vip/translate"
      priority: 1
    
    - name: "deepseek"
      api_key: "${DEEPSEEK_API_KEY}"
      endpoint: "https://api.deepseek.com"
      priority: 2

# ============ JWT 认证配置 ============
jwt:
  secret: "${JWT_SECRET_KEY}"
  algorithm: "HS256"
  expiration_hours: 24
  refresh_expiration_days: 7

# ============ 日志配置 ============
logging:
  level: "info"  # debug, info, warning, error, critical
  format: "json"  # json, text
  file_path: "./logs/yachiyo.log"
  max_file_size_mb: 100
  retention_days: 30
  
  # 日志模块级别
  modules:
    database: "info"
    websocket: "debug"
    auth: "info"
    moderation: "info"
    openclaw: "info"

# ============ 性能优化配置 ============
performance:
  # 消息处理
  message_queue_size: 1000
  worker_threads: 4
  batch_interval_ms: 100
  
  # 数据库连接池
  db_pool_min_size: 5
  db_pool_max_size: 20
  db_connection_timeout_ms: 5000
  
  # 缓存
  cache_enabled: true
  cache_max_size: 10000
  cache_ttl_seconds: 3600

# ============ 环境变量映射 ============
# 从环境变量中读取敏感信息
# 在 Docker 或生产环境中配置：
# - DB_PASSWORD: PostgreSQL 密码
# - JWT_SECRET_KEY: JWT 签名密钥
# - SOVITS_API_KEY: GPT-SoVITS API 密钥
# - DEEPSEEK_API_KEY: DeepSeek API 密钥
# - BAIDU_TRANSLATE_APPID: 百度翻译 APPID
# - BAIDU_TRANSLATE_API_KEY: 百度翻译密钥
