services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: yachiyo-postgres
    restart: unless-stopped
    command: ["-c", "max_connections=200"]
    environment:
      POSTGRES_DB: yachiyo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yachiyo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: yachiyo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yachiyo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 C++ 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yachiyo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"    # HTTP API
      - "9001:9001"    # WebSocket
    environment:
      # 数据库 — 与 config.yaml 中 ${DB_HOST} / ${DB_NAME} 等环境变量引用对应
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=yachiyo
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres_dev_only}
      # WebSocket
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=9001
      # Redis
      - REDIS_HOST=redis
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-production-secret-key-change-me}
      # OpenClaw Gateway 直连 (审查+翻译由 OpenClaw 统一处理)
      - OPENCLAW_ENDPOINT=${OPENCLAW_ENDPOINT:-http://host.docker.internal:8100}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-deepseek/deepseek-v4-flash}
      # 运行环境
      - APP_LOG_LEVEL=INFO
      - ENVIRONMENT=production
    volumes:
      - ./backend/config:/app/config
      - yachiyo_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - yachiyo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端 Vue 应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yachiyo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # 注意: VITE_ 前缀变量是构建时注入的，运行时设置无效。
    # 请在 frontend/.env.production 中配置，或在 docker build 时通过 ARG 传入。
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - yachiyo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: yachiyo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - yachiyo-network
    depends_on:
      - backend
      - frontend

  # pgAdmin - PostgreSQL 管理工具
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yachiyo-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@yachiyo.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin_dev_only}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - yachiyo-network
    depends_on:
      - postgres

  # Redis Commander - Redis 管理工具
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: yachiyo-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - yachiyo-network
    depends_on:
      - redis

  # Prometheus - 监控系统
  prometheus:
    image: prom/prometheus:latest
    container_name: yachiyo-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./backend/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - yachiyo-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana - 数据可视化
  grafana:
    image: grafana/grafana:latest
    container_name: yachiyo-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_dev_only}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - yachiyo-network
    depends_on:
      - prometheus

# 网络配置
networks:
  yachiyo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  yachiyo_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local
