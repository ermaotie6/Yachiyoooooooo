version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: yachiyo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yachiyo_cpp
      MYSQL_USER: yachiyo
      MYSQL_PASSWORD: yachiyopassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yachiyo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: yachiyo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yachiyo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # YachiyoCPP 应用
  yachiyo-cpp:
    build: .
    container_name: yachiyo-cpp
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"  # 监控端口
    environment:
      - YACHIYO_DB_HOST=mysql
      - YACHIYO_DB_PORT=3306
      - YACHIYO_DB_NAME=yachiyo_cpp
      - YACHIYO_DB_USER=yachiyo
      - YACHIYO_DB_PASSWORD=yachiyopassword
      - YACHIYO_REDIS_HOST=redis
      - YACHIYO_REDIS_PORT=6379
      - YACHIYO_JWT_SECRET=production-secret-key-change-me
      - YACHIYO_LOG_LEVEL=info
    volumes:
      - ./config:/app/config
      - yachiyo_logs:/app/logs
      - ./data:/app/data
    networks:
      - yachiyo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: yachiyo-prometheus
    restart: unless-stopped
    depends_on:
      - yachiyo-cpp
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - yachiyo-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana 仪表板
  grafana:
    image: grafana/grafana:latest
    container_name: yachiyo-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - yachiyo-network

  # Nginx 反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: yachiyo-nginx
    restart: unless-stopped
    depends_on:
      - yachiyo-cpp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - yachiyo-network

  # Ollama AI 服务 (可选)
  ollama:
    image: ollama/ollama:latest
    container_name: yachiyo-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - yachiyo-network
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0

# 网络配置
networks:
  yachiyo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  yachiyo_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ollama_data:
    driver: local