# YachiyoCPP 配置文件
# 注意: 此文件在 Docker 部署时通过 docker-compose 挂载到容器的 /app/config/ 目录
# 配置键名必须与 Application.cpp 中 configManager->getString/getInt 的 key 路径一致

# ============ 服务器配置 ============
server:
  host: "${SERVER_HOST:0.0.0.0}"
  port: 8080
  debug: false
  log_level: "info"
  threads: 4
  max_connections: 1000
  timeout: 30
  ssl_enabled: false
  ssl_cert: ""
  ssl_key: ""

# ============ WebSocket 配置 ============
websocket:
  enabled: true
  host: "${WEBSOCKET_HOST:0.0.0.0}"
  port: 9001
  path: "/ws"
  max_connections: 1000
  heartbeat_interval_ms: 30000
  idle_timeout_ms: 300000

# ============ 数据库配置 ============
database:
  type: "postgresql"
  host: "${DB_HOST:localhost}"
  port: 5432
  name: "${DB_NAME:yachiyo}"
  username: "${DB_USER:postgres}"
  password: "${DB_PASSWORD}"
  connection_timeout: 30
  poolSize: 20
  max_idle_time: 300

# ============ Redis 缓存配置 ============
redis:
  enabled: true
  host: "${REDIS_HOST:localhost}"
  port: 6379
  database: 0
  password: ""
  ttl_seconds: 3600
  pool_size: 10

# ============ GPT-SoVITS 配置 ============
gpt_sovits:
  enabled: true
  api_endpoint: "${SOVITS_ENDPOINT:http://localhost:5000}"
  api_key: "${SOVITS_API_KEY}"
  mode: "cpu"
  timeout_seconds: 60
  voice_presets:
    default:
      pitch: 1.0
      speed: 1.0
      energy: 0.5
      reference_audio: ""
    playful:
      pitch: 1.2
      speed: 1.1
      energy: 0.8
      reference_audio: ""
    serious:
      pitch: 0.9
      speed: 0.9
      energy: 0.6
      reference_audio: ""

# ============ Live2D 配置 ============
live2d:
  model_path: "./resources/live2d"
  default_model: "yachiyo"
  expression_map:
    neutral: "f_smile"
    happy: "f_smile"
    sad: "f_sad"
    angry: "f_squint"
    surprised: "f_cry"
    cry: "f_cry"
    squint: "f_squint"
  motion_map:
    greet: "m_greet"
    nod: "m_nod"
    shake: "m_shake"
    think: "m_think"
    wave: "m_wave"
    idle: "m_idle"

# ============ 内容审核配置 ============
# AI 语义审核已收归 OpenClaw System Prompt 统一处理
# 规则层 (速率限制/IP黑名单/敏感词) 仍由 MessageServiceImpl 执行
moderation:
  enabled: true
  keywords_path: "./resources/keywords/sensitive_words.txt"

# ============ OpenClaw 网关直连配置 ============
# 架构: C++ 后端 —HTTP POST—→ OpenClaw Gateway /v1/chat/completions
openclaw:
  enabled: true
  
  # OpenClaw Gateway API 端点
  # Docker 内用 host.docker.internal，宿主机用 localhost
  api_endpoint: "${OPENCLAW_ENDPOINT:http://host.docker.internal:8100}"
  
  # Gateway 认证令牌
  auth_token: "${OPENCLAW_GATEWAY_TOKEN}"
  
  # 使用的模型
  model: "${OPENCLAW_MODEL:deepseek/deepseek-v4-flash}"
  
  # System Prompt 文件路径 (容器内路径)
  system_prompt_path: "/app/config/yachiyo_system_prompt.txt"
  
  # 请求超时 (秒)
  request_timeout: 30
  response_cache_enabled: true
  response_cache_ttl: 300

# ============ 翻译配置 ============
# 翻译已收归 OpenClaw System Prompt 统一处理 (translation 字段)
translation:
  enabled: true
  default_language: "zh"

# ============ JWT 认证配置 ============
jwt:
  secret: "${JWT_SECRET_KEY}"
  algorithm: "HS256"
  expiration_hours: 24
  refresh_expiration_days: 7
  issuer: "yachiyo-cpp"
  audience: "yachiyo-users"

# ============ 虚拟形象配置 ============
avatar:
  language: "ja"
  default_emotion: "neutral"
  model_path: "resources/live2d"

# ============ AI 服务配置 ============
# AI 对话/审查/翻译 统一由 OpenClaw Gateway 处理
# 以下配置仅供 AIController 备用 (非核心管线)
ai:

# ============ 日志配置 ============
logging:
  level: "info"
  format: "json"
  file_path: "./logs/yachiyo.log"
  max_file_size_mb: 100
  retention_days: 30
  console_output: true
  modules:
    database: "info"
    websocket: "debug"
    auth: "info"
    moderation: "info"
    openclaw: "info"

# ============ 安全配置 ============
security:
  password_min_length: 8
  password_require_uppercase: true
  password_require_lowercase: true
  password_require_digits: true
  password_require_special: true
  login_attempts_limit: 5
  login_lockout_minutes: 30
  cors_enabled: true
  cors_origins: "*"

# ============ 性能优化配置 ============
performance:
  message_queue_size: 1000
  worker_threads: 4
  batch_interval_ms: 100
  db_pool_min_size: 5
  db_pool_max_size: 20
  db_connection_timeout_ms: 5000
  cache_enabled: true
  cache_max_size: 10000
  cache_ttl_seconds: 3600
  max_request_size_mb: 10
  rate_limit_enabled: true
  rate_limit_requests_per_minute: 60

# ============ 监控配置 ============
monitoring:
  enabled: true
  metrics_port: 9090
  health_check_path: "/health"
  prometheus_enabled: true
