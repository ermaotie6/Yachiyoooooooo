# Yachiyo 监控 - Prometheus 配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    monitor: 'yachiyo-monitor'

# 告警规则文件（可选）
# rule_files:
#   - "alert_rules.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Yachiyo 后端服务
  - job_name: 'yachiyo-backend'
    metrics_path: '/api/v1/health/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'yachiyo-backend'
          environment: 'production'

  # PostgreSQL 数据库监控（需要 postgres_exporter）
